<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cofre de Senhas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="fundo-decorativo" aria-hidden="true"></div>

    <div class="app">

        <header class="topo">
            <div class="marca">
                <span class="marca-icone">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="4" y="10" width="16" height="10" rx="2.5" stroke="currentColor" stroke-width="1.6"/>
                        <path d="M7.5 10V7.5a4.5 4.5 0 0 1 9 0V10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                        <circle cx="12" cy="14.6" r="1.6" fill="currentColor"/>
                        <path d="M12 16.2V17.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                    </svg>
                </span>
                <h1>Cofre de Senhas</h1>
            </div>
            <span id="instanciaInfo" class="instancia oculto"></span>
        </header>

        <!-- Tela de login / cadastro, mostrada quando nao ha token salvo -->
        <section id="telaAuth" class="tela-auth">
            <form id="formAuth" class="cartao cartao-auth">
                <h2 id="tituloAuth">Entrar</h2>
                <p class="subtitulo">Acesse o seu cofre de credenciais</p>

                <label>
                    Email
                    <input type="email" id="authEmail" autocomplete="username" required>
                </label>
                <label>
                    Senha
                    <input type="password" id="authSenha" autocomplete="current-password" required minlength="6">
                </label>

                <button type="submit" class="botao botao-primario botao-full">
                    <span class="rotulo">Entrar</span>
                </button>

                <p class="erro" id="authErro"></p>

                <button type="button" id="alternarAuth" class="link">Ainda não tenho conta — cadastrar</button>
            </form>
        </section>

        <!-- Tela principal do cofre, mostrada apos o login -->
        <section id="telaVault" class="tela-vault oculto">
            <div class="topo-vault">
                <span id="usuarioLogado" class="usuario-logado"></span>
                <button id="botaoSair" class="botao botao-fantasma">Sair</button>
            </div>

            <form id="formNovoItem" class="cartao">
                <h2>Nova credencial</h2>
                <div class="grade-form">
                    <label>
                        Serviço
                        <input type="text" id="novoServico" placeholder="Ex: Netflix" required>
                    </label>
                    <label>
                        Usuário/login
                        <input type="text" id="novoUsuario" required>
                    </label>
                    <label>
                        Senha
                        <input type="text" id="novaSenha" required>
                    </label>
                    <label>
                        URL (opcional)
                        <input type="text" id="novaUrl" placeholder="https://">
                    </label>
                </div>
                <button type="submit" class="botao botao-primario">
                    <span class="rotulo">Salvar no cofre</span>
                </button>
            </form>

            <h2 class="titulo-lista">Minhas credenciais</h2>
            <ul id="listaItens" class="lista-itens"></ul>
            <p id="listaVazia" class="lista-vazia oculto">Nenhuma credencial ainda. Cadastre a primeira acima.</p>
        </section>

    </div>

    <div id="toastContainer" class="toast-container" aria-live="polite"></div>

    <script src="app.js"></script>
</body>
</html>
