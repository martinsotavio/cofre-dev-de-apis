# Gateway unico da aplicacao: serve o frontend estatico e faz proxy reverso
# para a API, com rate limiting e balanceamento de carga entre as instancias.

# Um unico worker: o contador de round-robin do Nginx e' por processo, entao
# com mais de um worker cada requisicao pode cair em um processo diferente
# (cada um comecando sempre pela primeira instancia), o que esconde a
# alternancia entre api1/api2 numa demonstracao com poucas requisicoes.
# Um worker so basta para o volume desta aplicacao e deixa o balanceamento
# visivel de forma deterministica.
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Zonas de rate limit (chave = IP do cliente):
    # - login_limit: bem restrita, para dificultar forca bruta no login.
    # - general_limit: mais folgada, para o uso normal do cofre.
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=3r/m;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=10r/s;

    # Load balancing: por padrao o Nginx usa round-robin entre os servers
    # listados aqui, alternando as requisicoes entre api1 e api2.
    upstream api_backend {
        server api1:3000;
        server api2:3000;
    }

    server {
        listen 80;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Login com rate limit rigoroso (protecao contra forca bruta).
        location /api/auth/login {
            limit_req zone=login_limit burst=2 nodelay;
            error_page 503 = @rate_limited;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Demais rotas da API: rate limit geral + balanceamento entre instancias.
        location /api/ {
            limit_req zone=general_limit burst=20 nodelay;
            error_page 503 = @rate_limited;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Resposta em JSON quando o rate limit bloqueia - sem isso, o Nginx
        # devolveria uma pagina de erro HTML padrao, que o frontend nao sabe
        # interpretar (ele espera sempre JSON das rotas /api/).
        location @rate_limited {
            default_type application/json;
            return 503 '{"erro":"Muitas tentativas seguidas. Aguarde um minuto e tente novamente."}';
        }
    }
}
